# Checks on every push and pull request, now that the repository is public
# (D14).
#
# 1. A secret scan of the whole git history with gitleaks, run as its image
#    pinned by digest (its GitHub Action needs a paid licence for
#    organisations), with findings redacted: this log is public.
# 2. scripts/guard.mjs, the generic half: no private IPv4 address and no user
#    profile path in any tracked file. The owner's own list of private strings
#    exists only on the owner's workstation.
# 3. The pages: scripts/facts.mjs (what the under-the-hood page may say, D17)
#    and scripts/csp.mjs --check (each page's policy matches it).
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks, over every commit
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose --exit-code 1

  guard:
    name: nothing about the owner's network
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: guard
        run: node scripts/guard.mjs

  pages:
    name: the pages say only what they may
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every statement under the hood is in its fact sheet, with the same
      # words and status, and no page has an en or em dash (D17).
      - name: the fact sheet
        run: node scripts/facts.mjs
      # Each page's Content-Security-Policy matches the page (D10, D17).
      - name: the policies
        run: node scripts/csp.mjs --check
