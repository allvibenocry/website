# Builds the site's image and pushes it to GHCR when a version tag is pushed
# (D5, D12). Vikt's release workflow, adapted to one small image.
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# The image gets two tags and never a third:
#
#   v0.1.1         what the Portainer stack pins; a rollback is the previous one
#   sha-<commit>   the full commit it was built from, for anything that must be
#                  traced back to source
#
# There is no `latest` (rule 6): nothing may deploy it, so nothing pushes it.
#
# **The tested image is the pushed image.** It is built once, run and checked
# the way production runs it, and only then tagged and pushed, so a failing
# check means nothing reached the registry.
name: release

on:
  push:
    tags: ["v*.*.*"]

# One run per tag, and a release is never cancelled half-way through a push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/allvibenocry/website
  # What the package's visibility must be: public (D15), because the production
  # host pulls it anonymously, with no registry credential. The last step
  # proves it with an anonymous pull, and fails the release otherwise, so a
  # package that has become private again is found here, not at the deploy.
  PACKAGE_VISIBILITY: public

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      # The only write this job needs, to its own organisation's registry.
      packages: write

    steps:
      # Pinned by commit, not by tag: this job can push to the registry that
      # production pulls from, so what runs in it is fixed (D12).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag is a version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"
            exit 1
          fi

      # A page whose own header would block its script must never be built.
      - name: The CSP matches the page
        run: node scripts/csp.mjs --check

      - name: Build
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.title=allvibenocry.com" \
            -t website:candidate .

      # Run the way the stack runs it, and ask what the stack's users will get.
      - name: The image works before anything is pushed
        run: |
          set -euo pipefail
          docker run -d --name site --read-only --tmpfs /tmp:size=8m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 64m --pids-limit 64 -p 127.0.0.1:8080:8080 website:candidate

          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' site)" = healthy ] && break
            sleep 1
          done
          echo "health: $(docker inspect -f '{{.State.Health.Status}}' site)"
          [ "$(docker inspect -f '{{.State.Health.Status}}' site)" = healthy ]

          # Scratch files outside the checkout, so nothing can be left in it.
          page="$RUNNER_TEMP/page.txt"
          curl -sS -D "$page" -o /dev/null -H 'Accept-Encoding: gzip' http://127.0.0.1:8080/
          cat "$page"
          grep -qi '^content-security-policy: default-src .none.' "$page"
          grep -qi '^x-content-type-options: nosniff' "$page"
          grep -qi '^referrer-policy: no-referrer' "$page"
          grep -qi '^permissions-policy: ' "$page"
          grep -qi '^cache-control: no-cache' "$page"
          grep -qi '^content-encoding: gzip' "$page"

          font=$(ls site/fonts/*.woff2 | head -1 | sed 's#^site##')
          curl -sS -D "$RUNNER_TEMP/font.txt" -o /dev/null "http://127.0.0.1:8080${font}"
          grep -qi '^cache-control: public, max-age=31536000, immutable' "$RUNNER_TEMP/font.txt"

          [ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/favicon.ico)" = 204 ]

          # Nothing about a visitor is logged (D11): after all of the above,
          # the container's log is empty.
          if [ -n "$(docker logs site 2>&1)" ]; then
            echo "::error::the container logged something"; docker logs site; exit 1
          fi
          docker rm -f site

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push the tested image
        run: |
          set -euo pipefail
          docker tag website:candidate "$IMAGE:$GITHUB_REF_NAME"
          docker tag website:candidate "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:sha-$GITHUB_SHA"

      # Read back from the registry rather than trusting the push: both tags
      # exist, and they are the same image.
      - name: What was published
        run: |
          set -euo pipefail
          a=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" | awk '/^Digest:/ {print $2}')
          b=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" | awk '/^Digest:/ {print $2}')
          [ -n "$a" ]
          echo "$IMAGE:$GITHUB_REF_NAME      $a"
          echo "$IMAGE:sha-$GITHUB_SHA  $b"
          [ "$a" = "$b" ]
          {
            echo "### \`$IMAGE\`"
            echo '```'
            echo "$GITHUB_REF_NAME"
            echo "sha-$GITHUB_SHA"
            echo "digest $a"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Vikt's check (Vikt D160; D12, D15). A package on GHCR has a visibility of
      # its own; this asks the registry the way an anonymous puller would, with
      # no credential, and fails unless the answer matches PACKAGE_VISIBILITY.
      - name: The package's visibility is what it should be
        run: |
          set -euo pipefail
          repo="${IMAGE#ghcr.io/}"
          code=$(curl -s -o "$RUNNER_TEMP/token.json" -w '%{http_code}' \
            "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io")
          status=none
          if [ "$code" = 200 ]; then
            token=$(jq -r '.token // empty' "$RUNNER_TEMP/token.json")
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${GITHUB_REF_NAME}")
          fi
          echo "anonymous pull: token endpoint $code, manifest $status"
          if [ "$status" = 200 ]; then seen=public; else seen=private; fi
          if [ "$seen" != "$PACKAGE_VISIBILITY" ]; then
            echo "::error::$repo is $seen to an anonymous puller; PACKAGE_VISIBILITY says $PACKAGE_VISIBILITY"
            exit 1
          fi
          echo "$repo is $seen, as it should be"
