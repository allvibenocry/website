# The whole nginx configuration for the site (D3, D9, D10, D11).
#
# Replaces the image's own nginx.conf, and does not include conf.d/, so nothing
# the base image ships can add a server block or a log line behind this file's
# back. Runs as uid 101 on a read-only filesystem: the only writable path is the
# tmpfs at /tmp, which holds the pid file and the temp directories below.

worker_processes 1;
pid /tmp/nginx.pid;

# Nothing about a visitor is written anywhere (rule 5, D11).
#
# There is no access log, and the error log is at `emerg` because every
# request-level message nginx writes, at any level, ends with ", client:
# <address>". `emerg` is the level at which nginx refuses to start, which is
# the one thing worth seeing here; whether it is serving is the health check's
# question, not the log's.
error_log /dev/stderr emerg;

events {
    worker_connections 512;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset      utf-8;

    access_log    off;
    log_not_found off;
    server_tokens off;

    sendfile   on;
    tcp_nopush on;

    # A static page takes no request bodies and needs no patience.
    client_max_body_size  1k;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     30s;

    # Text is compressed; the fonts are woff2, which is compressed already.
    # text/html is always included once gzip is on.
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # How long a browser may keep each response (D7, D9).
    #
    # A font's name carries its content hash, so it can never change under the
    # same URL and is cached for a year. Everything else, the page first of all,
    # is revalidated on every visit: the ETag makes that a 304 when nothing
    # changed, and a new release is seen at once.
    map $uri $cache_control {
        "~^/fonts/[a-z0-9-]+\.[0-9a-f]{8}\.woff2$" "public, max-age=31536000, immutable";
        default                                     "no-cache";
    }

    # Each page's own Content-Security-Policy, by URI: $content_security_policy
    # (D10, D17). Generated by scripts/csp.mjs; sent by headers.conf.
    include /etc/nginx/csp.conf;

    server {
        listen      8080 default_server;
        server_name _;
        root        /srv/site;

        # A redirect names only the path, never a host or a port: behind the
        # edge, the visitor reached the site at another address than this one.
        absolute_redirect off;

        # Every response gets these, errors included. They are set here and in
        # no location: a location with an add_header of its own would silently
        # drop all of them.
        add_header Cache-Control $cache_control always;
        include    /etc/nginx/headers.conf;

        location = / {
            try_files /index.html =404;
        }

        # The technical page, at its clean URL (D17). The file keeps its
        # extension, so its type comes from mime.types like every other file's;
        # the two other ways of writing the address are sent to this one.
        location = /under-the-hood {
            try_files /under-the-hood.html =404;
        }
        location = /under-the-hood/ {
            return 301 /under-the-hood;
        }
        location = /under-the-hood.html {
            return 301 /under-the-hood;
        }

        # Browsers ask for this on their own and the page declares no icon.
        # "No content" keeps the tab exactly as it is, without the 404 the
        # console would otherwise log on every first visit (D9).
        location = /favicon.ico {
            return 204;
        }

        # Files only: a directory is not a page, and there is no listing.
        location / {
            try_files $uri =404;
        }
    }
}
