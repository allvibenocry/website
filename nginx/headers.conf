# Security headers on every response (D4, D10). Included once, at server level.

# Never guess a type: a file is what its Content-Type says.
add_header X-Content-Type-Options "nosniff" always;

# Following a link out of the site tells the other side nothing, not even
# that the visitor came from here.
add_header Referrer-Policy "no-referrer" always;

# The page uses none of these, so nothing it loads may either. Only features
# Chromium recognises are listed: an unknown one is logged as a console error.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# The Content-Security-Policy of the page being served (D10, D17): chosen by URI
# in csp.conf, which scripts/csp.mjs generates from the pages, because each
# policy carries the hashes of its own page's inline script and style.
add_header Content-Security-Policy $content_security_policy always;
