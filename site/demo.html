    later(() => {
      p.ship.done = true; p.live = v;
      p.versions.unshift({ v, when: 'Just now', what: p.plan.title + '.', commit: 'b7d2c19', migs: p.kind === 'guestbook' ? ['004_add_photo.sql: only adds'] : [] });
      if (!p.backups.length) p.backups.push({ when: 'Just now', size: '1 MB', ok: true });
      p.plan = null;
      p.fresh = false;
      p.chat.push(['arch', `v${v} is live. Tell me what you want to change next.`]);
      refreshAll(p);
      if (here(p)){ announce(`v${v} is live. Everyone on your home network uses it now.`); focusGuide(); }
    }, t + 300);
  }
  function rollbackDialog(p, v){
    openModal(`<h2 id="dialog-title">Go back to v${v}?</h2>
      <p>The live app goes back to v${v}. Your ${esc(p.countWord)} stay: everything written since then is kept.</p>
      <p>The changes since v${v} only added things to the data, so v${v} works with today's data. Before switching, a fresh backup is taken and checked, like every release.</p>
      <div class="dialog-actions"><button type="button" class="btn line" data-action="close">Keep v${p.live}</button><button type="button" class="btn" data-action="do-rollback" data-v="${v}">Go back to v${v}</button></div>`);
  }
  function doRollback(p, v){ closeModal(); toast(`Going back to v${v}: backup taken and checked, v${v} started and answering.`); later(() => { p.live = v; refreshAll(p); toast(`v${v} is live again. Nothing was lost.`); }, 1600); }

  /* ---------- A new app: it opens in planning ---------- */
  /* As in the panel (the product's D77): a name, and the app opens in Plan, where you start its AI and tell it your idea. */
  function newAppDialog(){
    openModal(`<h2 id="dialog-title">Make a new app</h2>
      <p>It starts as a small guestbook, with a test copy and a live app of its own. Then you tell your AI what it should become.</p>
      <div class="field"><label for="na-name">Its name</label><input id="na-name" placeholder="For example: Chore chart" maxlength="40"></div>
      <div class="dialog-actions"><button type="button" class="btn line" data-action="close">Not now</button><button type="button" class="btn" data-action="make-plan">Make it</button></div>`);
  }
  function makePlan(){
    const name = ($('#na-name').value || '').trim() || 'Chore chart';
    const id = 'app' + Date.now(); const port = 8100 + S.projects.length * 2;
    const p = { id, kind: 'new', name, idea: '', live: 0, prodPort: port, devPort: port + 1, count: 0, countWord: 'entries', making: false, plan: null, ai: 'off', trying: null,
      chat: [], log: [['tool', 'Created the project from the starter template']],
      brief: '', versions: [], backups: [], keys: [], ship: null };
    S.projects.push(p);
    closeModal(); lastFocus = null; lastKey = null;
    openApp(id, { show: 'chat' });
    announce(`${name} is made. Next: start your AI.`);
    focusGuide();
  }
  /* Your AI, started (the product's D77); in the demo it takes a moment, and then says it is ready. */
  function startAI(p){
    if (mcp()){ mcpDialog(); return; }
    p.ai = 'starting'; refreshAll(p); announce('Starting your AI.');
    later(() => {
      p.ai = 'on';
      p.chat.push(['arch', p.plan ? 'Ready. I have read the plan and where things stand.' : `Ready. Tell me what ${p.name} should become, in your own words.`]);
      refreshAll(p);
      if (here(p)){ announce('Your AI is running. Its terminal is under your plan.'); focusGuide(); }
    }, 1500);
  }
  /* An idea told to the AI in its terminal: a plan in three steps, proposed, and nothing built until you say so. */
  function planFor(p, idea){
    if (p.kind === 'new' && !p.idea) p.idea = idea;
    p.making = true; p.chat.push(['working', 'Making a plan']); p.log.push(['you', `plan mode: ${idea}`]);
    refreshAll(p);
    later(() => {
      p.making = false;
      const first = p.kind === 'new' && !p.live;
      const title = first ? `A first version of ${p.name}` : idea.split(/(?<=[.!?])\s/)[0].replace(/[.!?]+$/, '').slice(0, 60);
      p.plan = { title, steps: [
        { t: first ? 'A first page for your idea' : 'The first part of it', c: 'you can see it in the preview.', y: `look at the preview. You should see ${first ? 'a first page for your idea' : 'the first part of it'}.`, s: 'proposed' },
        { t: 'What people enter is kept', c: 'it is still there after a restart.', y: 'enter something, restart the test copy, and check that it is still there.', s: 'proposed' },
        { t: 'Make it yours', c: 'it looks and works the way you want.', y: 'look around, and check that it looks and works the way you want.', s: 'proposed' } ]};
      p.brief = `# Brief: ${lc(title)}\n\n1. ${p.plan.steps[0].t}.\n2. What people enter is kept.\n3. Make it yours.\n\nRules\n- Migrations only add.\n- Stop after each step.`;
      dropWorking(p);
      p.chat.push(['plan', 'Here is a plan in three steps, shown under "Your plan". I stop after each one so that you can try it, and nothing is built until you tell me to start. (In the demo, the plan is always these three steps.)']);
      p.log.push(['tool', 'Read AGENTS.md and STATE.md'], ['tool', 'Wrote the plan to plan.json and STATE.md'], ['ai', 'Proposed 3 steps. Waiting for the go-ahead.']);
      refreshAll(p);
      if (here(p)){ announce('The plan is ready. Read it, then tell your AI in its terminal when it may start.'); focusGuide(); }
    }, 1400);
  }

  /* ---------- Own services ---------- */
  const ICON = {
    net: '<svg viewBox="0 0 20 20"><path d="M3 9l7-6 7 6v8H3z"/><path d="M7 13a4 4 0 0 1 6 0M8.6 15a1.8 1.8 0 0 1 2.8 0"/></svg>',
    usb: '<svg viewBox="0 0 20 20"><rect x="6" y="2" width="8" height="7" rx="1"/><path d="M5 9h10v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/><path d="M8.5 4.5v2M11.5 4.5v2"/></svg>',
    data: '<svg viewBox="0 0 20 20"><ellipse cx="10" cy="5" rx="6" ry="2.4"/><path d="M4 5v10c0 1.3 2.7 2.4 6 2.4s6-1.1 6-2.4V5M4 10c0 1.3 2.7 2.4 6 2.4s6-1.1 6-2.4"/></svg>',
    home: '<svg viewBox="0 0 20 20"><rect x="4" y="9" width="12" height="9" rx="2"/><path d="M7 9V6a3 3 0 0 1 6 0v3"/></svg>',
    dns: '<svg viewBox="0 0 20 20"><path d="M10 2v16M10 4h6l2 2-2 2h-6M10 10H4l-2 2 2 2h6"/></svg>',
    port: '<svg viewBox="0 0 20 20"><path d="M7 2v4M13 2v4M5 6h10v4a5 5 0 0 1-10 0z M10 15v3"/></svg>'
  };
  const PERMS = {
    ha: { name: 'Home Assistant', items: [
      ['big', 'net', 'See your whole home network', 'To find lamps, speakers and sensors. For this it runs outside the walls that keep your apps apart.'],
      ['', 'usb', 'Use a USB stick, if you plug one in', 'For Zigbee or Z-Wave devices.'],
      ['', 'data', 'Keep its data on this machine', 'About 1 GB, backed up every night with your apps.'],
      ['', 'home', 'Only reachable from your home network', 'Not from the internet, just like this panel.']
    ], note: "It runs as a container, so Home Assistant's own add-ons are not available in this setup." },
    pihole: { name: 'Pi-hole', items: [
      ['big', 'dns', 'Answer DNS for your whole home', 'Every device asks it where websites are. If this machine is off, the internet at home stops working, unless your router has a backup DNS.'],
      ['', 'port', 'Listen on port 53 on your home network', 'That is where devices send their DNS questions.'],
      ['', 'home', 'Its admin page is only reachable from your home network', 'Not from the internet.']
    ], note: 'Set a backup DNS in your router before you rely on it, so a restart never takes the internet away.' }
  };
  function permsDialog(sid, install){
    const P = PERMS[sid];
    const list = P.items.map(([cls, ic, t, d]) => `<li class="${cls}"><span class="pi" aria-hidden="true">${ICON[ic]}</span><div><b>${t}</b><span>${d}</span></div></li>`).join('');
    openModal(`<h2 id="dialog-title">${install ? `Install ${P.name}?` : `What ${P.name} can access`}</h2>
      <p>${install ? `${P.name} will be able to:` : 'This is everything it was given when it was installed.'}</p>
      <ul class="perm">${list}</ul>
      <p>${P.note}</p>
      ${install ? `<div class="consent"><input type="checkbox" id="svc-ok" data-action="svc-consent"><label for="svc-ok">I understand what ${P.name} will be able to access.</label></div>` : ''}
      <div class="dialog-actions">${install ? `<button type="button" class="btn line" data-action="close">Cancel</button><button type="button" class="btn" id="svc-go" data-action="svc-do-install" data-s="${sid}" disabled>Install ${P.name}</button>` : '<button type="button" class="btn" data-action="close">Close</button>'}</div>`);
  }
  function installHA(){ closeModal(); toast('Installing Home Assistant: fetching it, giving it what you allowed, and checking that it answers.'); later(() => { S.services.ha.installed = true; if (S.view === 'services') keepFocus(renderMain); toast('Home Assistant is running. Its data is included in tonight\'s backup.'); }, 2000); }
  function updateHA(){
    const ha = S.services.ha; const fail = S.failUpdate;
    ha.upd = { to: ha.next, stage: 0, msg: 'Backing up Home Assistant\'s data.', fail };
    const r = () => { if (S.view === 'services') keepFocus(renderMain); };
    r();
    later(() => { ha.upd.stage = 1; ha.upd.msg = `Starting ${ha.next}.`; r(); }, 1200);
    later(() => { ha.upd.stage = 2; ha.upd.msg = `Checking that ${ha.next} answers.`; r(); }, 2400);
    later(() => {
      if (fail){ ha.upd.end = 'back'; ha.upd.msg = `${ha.next} did not answer, so ${ha.version} is back, with its data as it was. Nothing was lost.`; toast(`The update failed its health check. ${ha.version} is running again.`); }
      else { ha.upd.stage = 4; ha.upd.end = 'ok'; ha.upd.msg = `${ha.next} is running and answering.`; ha.version = ha.next; toast(`Home Assistant ${ha.next} is running.`); }
      r();
      later(() => { ha.upd = null; r(); }, 4500);
    }, 3700);
  }

  function mcpDialog(){
    openModal(`<h2 id="dialog-title">Connect your own AI app</h2>
      <ol class="mini-plan"><li><b>Open your AI app</b><span>Claude Desktop, Claude Code, VS Code or Cursor, on a computer on your home network.</span></li>
      <li><b>Add this machine to it</b><span>This kind of connection is called MCP. Use the address this machine shows you.</span></li>
      <li><b>Enter the connection code</b><span>A one-time connection code, shown once.</span></li></ol>
      <p>Your AI app signs in the way it always does. This machine never sees your AI login. The AI can only reach test copies, every call it makes is logged, and releases always happen here in the panel.</p>
      <div class="dialog-actions"><button type="button" class="btn" data-action="close">Done</button></div>`);
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', e => {
    if (S.moreOpen && !e.target.closest('#more')) setMore(false);
    const t = e.target.closest('[data-go],[data-open],[data-rtab],[data-mtab],[data-ltab],[data-file],[data-action]'); if (!t) return;
    if (t.dataset.go){ go(t.dataset.go); return; }
    if (t.dataset.open){
      /* "Try step N" on the home screen opens the app already trying it (the product's D75). */
      const q = S.projects.find(x => x.id === t.dataset.open);
      openApp(t.dataset.open, { right: t.dataset.right, show: t.dataset.show, trying: t.dataset.try && q && q.plan ? current(q) : null });
      if (t.dataset.try || t.dataset.right) focusGuide();
      return;
    }
    if (t.dataset.rtab){ goRight(t.dataset.rtab); return; }
    if (t.dataset.mtab){ if (t.dataset.mtab === 'chat'){ S.m = 'chat'; renderTabs(); toBottom(); } else goRight(t.dataset.mtab); return; }
    if (t.dataset.ltab){ S.left = t.dataset.ltab; renderTabs(); renderLeft(); return; }
    if (t.dataset.file){ S.file = t.dataset.file; keepFocus(renderRight); return; }
    const a = t.dataset.action, p = proj();
    if (a === 'reset'){ timers.forEach(clearTimeout); timers = []; S = initial(); closeModal(); go('home'); background(); announce(''); toast('The demo is back where it started.'); }
    if (a === 'toggle-mode'){ closeMenu(); if (S.advanced) toSimple(); else modeDialog(); }
    if (a === 'to-simple') toSimple();
    if (a === 'adv-consent') $('#adv-go').disabled = !t.checked;
    if (a === 'to-advanced') toAdvanced(t.dataset.then);
    if (a === 'open-link') toast(S.advanced ? `In the demo there is no app behind this. In the real panel it opens allvibe.local:${t.dataset.port}.` : 'In the demo there is no app behind this. In the real panel it opens in a new tab.');
    if (a === 'open-svc') toast('In the demo there is no service behind this.');
    if (a === 'restart-test') toast('In the demo there is no app behind this. In the real panel, the test copy restarts, and the preview shows it again.');
    if (a === 'more') setMore(!S.moreOpen);
    if (a === 'more-backups'){ setMore(false); backupsDialog(p, $('#more-btn')); }
    if (a === 'more-keys'){ setMore(false); keysDialog(p, $('#more-btn')); }
    if (a === 'more-settings'){ setMore(false); settingsDialog(p, $('#more-btn')); }
    if (a === 'see-backups'){ openApp(t.dataset.id); backupsDialog(proj(), $('#more-btn')); }
    if (a === 'works') stepWorks(p, +t.dataset.i);
    if (a === 'report') reportDialog(p, +t.dataset.i);
    if (a === 'approve') approvePlan(p);
    /* The guided path's next actions (the product's D75, D77). */
    if (a === 'start-ai') startAI(p);
    if (a === 'focus-ai'){ if (narrow()){ S.m = 'chat'; renderTabs(); toBottom(); } const s = $('#say'); if (s) s.focus(); }
    if (a === 'guide-try'){ p.trying = +t.dataset.i; goRight('preview'); renderGuide(); focusGuide(); }
    if (a === 'guide-new'){ p.fresh = true; refreshAll(p); focusGuide(); }
    if (a === 'to-live'){ goRight('live'); focusIfLost('[data-action="ship"]'); focusIfLost('#shipcard'); focusIfLost(narrow() ? '#mtab-live' : '#rtab-live'); }
    if (a === 'to-preview'){ goRight('preview'); focusIfLost(narrow() ? '#mtab-preview' : '#rtab-preview'); }
    if (a === 'clear-marks'){ document.querySelectorAll('#shot .mark').forEach(m => m.remove()); marks = []; activeMark = null; countMarks(); }
    if (a === 'send-report'){ sendReport(p, +t.dataset.i); focusIfLost('#tryline'); }
    if (a === 'ship') ship(p);
    if (a === 'rollback') rollbackDialog(p, +t.dataset.v);
    if (a === 'do-rollback') doRollback(p, +t.dataset.v);
    if (a === 'close') closeModal();
    if (a === 'new-app'){ closeMenu(); newAppDialog(); }
    if (a === 'make-plan') makePlan();
    if (a === 'backup-now'){ toast('Taking a backup and checking it.'); later(() => { p.backups.unshift({ when: 'Just now', size: '14 MB', ok: true }); if (!$('#modal').hidden && $('#dialog').dataset.kind === 'backups') backupsDialog(p); toast('Backup taken, restored into a test copy and checked.'); }, 1500); }
    if (a === 'add-key') addKeyDialog();
    if (a === 'keys-back') keysDialog(p);
    if (a === 'save-key') saveKey();
    if (a === 'save-settings'){ const n = ($('#as-name').value || '').trim(); if (n) p.name = n; closeModal(); refreshAll(p); toast('Saved. In the demo, the new name lasts until you start over.'); }
    if (a === 'brief') briefDialog(p);
    if (a === 'save-brief'){ p.brief = $('#brief-text').value; closeModal(); chat(p, 'arch', 'I have read your changes to the instructions. The builder gets them before the next step.'); toast('The instructions are saved.'); }
    if (a === 'recheck'){ toast('Running the checks.'); later(() => toast('Checked just now. Nothing has changed.'), 1200); }
    if (a === 'demo-only') toast('In the demo, this button does nothing.');
    if (a === 'explain') toast(EXPLAIN[t.dataset.k]);
    if (a === 'logs') openModal(`<h2 id="dialog-title">Logs: ${esc(t.dataset.n)}</h2><div class="log-view">22:14:03 started, healthy<br>22:14:03 listening on the internal network<br>03:30:00 nightly backup: data exported<br>03:30:41 restore check: answered<br>07:02:18 health check: ok</div><div class="dialog-actions"><button type="button" class="btn" data-action="close">Close</button></div>`);
    if (a === 'see-updates'){ go('machine'); const u = $('#updates'); if (u){ u.scrollIntoView(); u.focus({preventScroll: true}); } }
    if (a === 'try-update') toast('In the real panel, this opens a short plan in the test copy. You try it, then put it live as usual.');
    if (a === 'copy-next'){
      const txt = t.dataset.text;
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copied. Paste it in your AI app.'), () => toast('Select the message and copy it.'));
      /* The demo stands in for your AI app: it reads the message and starts. */
      if (t.dataset.then === 'approve') later(() => { toast('In the demo, your AI app starts building now.'); approvePlan(p, txt); }, 900);
    }
    if (a === 'mcp-how') mcpDialog();
    if (a === 'profile'){ S.profile = t.dataset.p; keepFocus(renderMain); toast('Profile changed. In the demo, nothing else happens.'); }
    if (a === 'defaults') openModal(`<h2 id="dialog-title">Load safe defaults?</h2><p>This puts back:</p><ul><li>the profile, to Balanced;</li><li>memory limits per app;</li><li>the backup schedule, to every night at 03:30.</li></ul><p class="safe">Your apps, their data, their keys and your own services are not touched.</p><div class="dialog-actions"><button type="button" class="btn line" data-action="close">Cancel</button><button type="button" class="btn" data-action="do-defaults">Load safe defaults</button></div>`);
    if (a === 'do-defaults'){ S.profile = 'balanced'; closeModal(); keepFocus(renderMain); toast('Safe defaults loaded.'); }
    if (a === 'svc-install') permsDialog(t.dataset.s, true);
    if (a === 'svc-perms') permsDialog(t.dataset.s, false);
    if (a === 'svc-consent') $('#svc-go').disabled = !t.checked;
    if (a === 'svc-do-install') installHA();
    if (a === 'svc-update') updateHA();
    if (a === 'fail-toggle') S.failUpdate = t.checked;
  });
  document.addEventListener('submit', e => {
    if (e.target.id !== 'say-form') return; e.preventDefault();
    const inp = $('#say'), v = inp.value.trim(), p = proj(); if (!v) return; inp.value = '';
    if (S.advanced && S.left === 'build'){ blog(p, 'you', v); later(() => blog(p, 'note', 'This is the demo, so the builder follows a script. In the real panel, you can talk to Claude Code directly here.'), 600); }
    /* In the AI's terminal: a plan waiting for its go-ahead starts; a first idea becomes a plan; anything else, the script says so. */
    else if (proposed(p)){ approvePlan(p, v); }
    else if (!p.plan && !p.making){ p.chat.push(['you', v]); p.fresh = false; planFor(p, v); }
    else { chat(p, 'you', v); later(() => chat(p, 'arch', 'This is the demo, so I follow a script and cannot answer freely. In the real panel, I would ask you about it and make a plan with you. A small change skips the plan and becomes one step.'), 600); }
  });
  document.addEventListener('change', e => { const m = e.target.dataset && e.target.dataset.mode; if (!m) return; S.aiMode = m; renderMain(); const r = document.querySelector(`input[data-mode="${m}"]`); r && r.focus(); if (m === 'mcp') mcpDialog(); });
  document.addEventListener('focusin', e => { if (S.moreOpen && !e.target.closest('#more')) setMore(false); });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', e => {
    const open = !$('#modal').hidden;
    if (open && e.key === 'Escape'){ if (activeMark){ return; } closeModal(); return; }
    if (open && e.key === 'Tab'){
      const f = [...$('#dialog').querySelectorAll(FOCUSABLE)].filter(x => x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
      else if (!$('#dialog').contains(document.activeElement)){ e.preventDefault(); first.focus(); }
      return;
    }
    if (S.moreOpen && e.key === 'Escape'){ e.preventDefault(); setMore(false); const b = $('#more-btn'); b && b.focus(); return; }
    const t = e.target;
    if (t.getAttribute && t.getAttribute('role') === 'tab' && ['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){
      const tabs = [...t.closest('[role="tablist"]').querySelectorAll('[role="tab"]')];
      let i = tabs.indexOf(t);
      if (e.key === 'ArrowRight') i = (i + 1) % tabs.length;
      if (e.key === 'ArrowLeft') i = (i - 1 + tabs.length) % tabs.length;
      if (e.key === 'Home') i = 0; if (e.key === 'End') i = tabs.length - 1;
      e.preventDefault(); const id = tabs[i].id; tabs[i].click(); const n = document.getElementById(id); n && n.focus();
    }
  });
  $('#menu-btn').addEventListener('click', () => { const s = $('#side'); const open = !s.classList.contains('open'); s.classList.toggle('open', open); $('#menu-btn').setAttribute('aria-expanded', String(open)); });
  /* Crossing 1080 px swaps two sides for one row of tabs, and the tab panels' names with them. */
  narrowMQ.addEventListener('change', () => { if (S.view === 'project') renderApp(); });

  function background(){
    const r = S.projects.find(p => p.id === 'recipes');
    later(() => {
      r.log.push(['tool', 'Edited src/recipes.js'], ['tool', 'Added migrations/002_recipes.sql (only adds)'], ['ai', 'Step 2 done. Stopping for the person to try it.']);
      dropWorking(r); r.chat.push(['done', 'Step 2 built and checked'], ['try', SCRIPT.recipes[1].tries]);
      r.plan.steps[1].s = 'ready'; refreshAll(r);
    }, 6000);
  }
  background();
  render();
})();
</script>
